name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=custom_components.sparkyfitness --cov-report=term-missing
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: bandit -r custom_components -q
      - name: Package integration
        run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: sparkyfitness-installation-${{ matrix.python }}
          path: dist/sparkyfitness.zip
          retention-days: 30
  hacs:
    # The official validator refuses private repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

name: Release package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package (must match manifest version)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Verify release version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('custom_components/sparkyfitness/manifest.json').read_text())
          if os.environ['RELEASE_TAG'] != 'v' + manifest['version']:
              raise SystemExit('Release tag and integration manifest version differ')
          PY
      - name: Build installation ZIP
        run: python scripts/package.py
      - name: Attach installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/sparkyfitness.zip --repo "$GITHUB_REPOSITORY"
